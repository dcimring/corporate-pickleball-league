<!doctype html>
<html lang="en">
  <head>
    <base href="/" />
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Fonts (preconnect + link instead of render-blocking CSS @import) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <!-- SEO & Social Sharing -->
    <title>Pickleball Cayman Corporate League</title>
    <meta name="description" content="View the latest standings, match results, and schedules for the Corporate Pickleball League at Pickleball Cayman." />
    
    <!-- Open Graph / Facebook / WhatsApp -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://pickleball.ky/corporate-league/" />
    <meta property="og:title" content="Pickleball Cayman Corporate League" />
    <meta property="og:description" content="View the latest standings, match results, and schedules for the Corporate Pickleball League." />
    <meta property="og:image" content="https://pickleball.ky/corporate-league/og-image.png" />

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:url" content="https://pickleball.ky/corporate-league/" />
    <meta property="twitter:title" content="Pickleball Cayman Corporate League" />
    <meta property="twitter:description" content="View the latest standings, match results, and schedules for the Corporate Pickleball League." />
    <meta property="twitter:image" content="https://pickleball.ky/corporate-league/og-image.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
